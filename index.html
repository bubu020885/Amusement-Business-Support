<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business-Rechner – Jahr 1</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f5f7;
  --card: #fff;
  --border: #e1e4e8;
  --text: #1a1d23;
  --muted: #6b7280;
  --shadow: 0 1px 4px rgba(0,0,0,.08);

  --c-guests:   #dbeafe; --c-guests-h: #1e3a5f; --c-guests-ac: #2563eb;
  --c-rev:      #dcfce7; --c-rev-h:    #14532d; --c-rev-ac:    #16a34a;
  --c-rev-tot:  #bbf7d0;
  --c-cog:      #ffedd5; --c-cog-h:    #7c2d12; --c-cog-ac:    #ea580c;
  --c-cog-tot:  #fed7aa;
  --c-gp:       #bae6fd; --c-gp-h:     #0c4a6e; --c-gp-ac:     #0284c7;
  --c-opex:     #ede9fe; --c-opex-h:   #4c1d95; --c-opex-ac:   #7c3aed;
  --c-opex-tot: #ddd6fe;
  --c-ebitda:   #d1fae5; --c-ebitda-ac:#059669; --c-ebitda-neg:#dc2626;
  --c-total-col:#f1f5f9;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 12px 60px;
}

h1 {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  letter-spacing: -.3px;
}

/* ── Card / Section ──────────────────────────── */
.card {
  background: var(--card);
  border-radius: 10px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .5px;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
.card-header .toggle { font-size: 10px; opacity: .6; }

.card-body { padding: 12px 14px; }

/* ── Config layout ───────────────────────────── */
.cfg-prices {
  display: grid;
  grid-template-columns: 1fr 88px 1fr 88px;
  gap: 6px 10px;
  align-items: center;
  margin-bottom: 12px;
}
.cfg-prices label { font-size: 12px; color: var(--muted); }

.cfg-sub {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--muted);
  margin: 8px 0 4px;
}

/* ── Dynamic rows ────────────────────────────── */
.drow {
  display: grid;
  gap: 5px;
  margin-bottom: 5px;
  align-items: center;
}
.drow--std  { grid-template-columns: 1fr 100px 76px 28px; }
.drow--wage { grid-template-columns: 1fr 88px 58px 58px 28px; }

.col-hd {
  display: grid;
  gap: 5px;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .3px;
  margin-bottom: 3px;
}
.col-hd--std  { grid-template-columns: 1fr 100px 76px 28px; }
.col-hd--wage { grid-template-columns: 1fr 88px 58px 58px 28px; }

input[type="number"], input[type="text"], select {
  width: 100%;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 12px;
  background: #fff;
  color: var(--text);
  -moz-appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input:focus, select:focus { outline: none; border-color: #9ca3af; }

.btn-del {
  border: none; background: none; cursor: pointer;
  color: #d1d5db; font-size: 14px; padding: 3px;
  border-radius: 4px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: color .12s, background .12s;
}
.btn-del:hover { color: #dc2626; background: #fee2e2; }

.btn-add {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; border: 1.5px dashed var(--border);
  border-radius: 5px; font-size: 11px; font-weight: 500;
  cursor: pointer; background: transparent; color: var(--muted);
  transition: background .12s;
  margin-top: 4px;
}
.btn-add:hover { background: rgba(0,0,0,.04); }
.btn-add--cog  { border-color: var(--c-cog-ac);  color: var(--c-cog-ac); }
.btn-add--opex { border-color: var(--c-opex-ac); color: var(--c-opex-ac); }

/* ── Config header colors ─────────────────────── */
.card--cfg .card-header { background: #f8fafc; color: #374151; }

/* ── Table section ───────────────────────────── */
.card--table .card-header { background: #1e293b; color: #f1f5f9; cursor: default; }

.tbl-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 860px;
  font-size: 12px;
}

/* Header row */
thead th {
  position: sticky;
  top: 0;
  background: #1e293b;
  color: #cbd5e1;
  font-weight: 600;
  font-size: 11px;
  padding: 7px 6px;
  text-align: right;
  white-space: nowrap;
  border-right: 1px solid #334155;
}
thead th:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  z-index: 2;
  min-width: 150px;
  background: #1e293b;
}
thead th.th-total {
  background: #0f172a;
  color: #e2e8f0;
}

/* Body rows */
tbody td {
  padding: 5px 6px;
  text-align: right;
  white-space: nowrap;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
tbody td:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  font-weight: 500;
  z-index: 1;
  border-right: 2px solid var(--border);
  padding-left: 10px;
}
tbody td.td-total {
  background: var(--c-total-col) !important;
  font-weight: 700;
}
tbody td.neg { color: var(--c-ebitda-neg); }
tbody td.pos { color: var(--c-ebitda-ac); }

/* Guest input cells */
td.td-guest input {
  width: 68px;
  padding: 3px 5px;
  font-size: 11px;
  text-align: right;
  border: 1px solid #93c5fd;
  background: #eff6ff;
}

/* Row group colors */
tr.tr-guests td { background: var(--c-guests); color: var(--c-guests-h); }
tr.tr-rev    td { background: #f0fdf4; }
tr.tr-rtot   td { background: var(--c-rev-tot); font-weight: 700; }
tr.tr-cog    td { background: #fffbf5; }
tr.tr-ctot   td { background: var(--c-cog-tot); font-weight: 700; }
tr.tr-gp     td { background: var(--c-gp); font-weight: 700; font-size: 12.5px; }
tr.tr-margin td { background: #f8fafc; color: var(--muted); font-style: italic; font-size: 11px; }
tr.tr-wage   td { background: #fdf4ff; }
tr.tr-opex   td { background: var(--c-opex); }
tr.tr-otot   td { background: var(--c-opex-tot); font-weight: 700; }
tr.tr-ebitda td { background: var(--c-ebitda); font-weight: 700; font-size: 13px; }

/* Sticky column inherits row color */
tr.tr-guests td:first-child { background: var(--c-guests); }
tr.tr-rev    td:first-child { background: #f0fdf4; }
tr.tr-rtot   td:first-child { background: var(--c-rev-tot); }
tr.tr-cog    td:first-child { background: #fffbf5; }
tr.tr-ctot   td:first-child { background: var(--c-cog-tot); }
tr.tr-gp     td:first-child { background: var(--c-gp); }
tr.tr-margin td:first-child { background: #f8fafc; }
tr.tr-wage   td:first-child { background: #fdf4ff; }
tr.tr-opex   td:first-child { background: var(--c-opex); }
tr.tr-otot   td:first-child { background: var(--c-opex-tot); }
tr.tr-ebitda td:first-child { background: var(--c-ebitda); }

/* Total column override on top of row color */
tr.tr-guests td.td-total { background: #bfdbfe !important; }
tr.tr-rtot   td.td-total { background: #86efac !important; }
tr.tr-ctot   td.td-total { background: #fdba74 !important; }
tr.tr-gp     td.td-total { background: #7dd3fc !important; }
tr.tr-otot   td.td-total { background: #c4b5fd !important; }
tr.tr-ebitda td.td-total { background: #6ee7b7 !important; }
</style>
</head>
<body>

<h1>Business-Rechner &mdash; Jahr 1 &middot; Monatsbasis</h1>

<!-- ═══════════════════════ CONFIG ═══════════════════════ -->
<div class="card card--cfg">
  <div class="card-header" onclick="toggleCfg()">
    <span>Einstellungen &amp; Kostenstruktur</span>
    <span class="toggle" id="cfgToggle">▲</span>
  </div>
  <div class="card-body" id="cfgBody">

    <!-- Prices -->
    <div class="cfg-sub">Spend per Cap (€)</div>
    <div class="cfg-prices">
      <label>Ø Ticketpreis</label>
      <input type="number" id="ticketPrice" value="15.00" min="0" step="0.5">
      <label>Retail / Gast</label>
      <input type="number" id="retailPrice" value="3.00"  min="0" step="0.5">
      <label>Games / Gast</label>
      <input type="number" id="gamesPrice"  value="5.00"  min="0" step="0.5">
      <label>F&amp;B / Gast</label>
      <input type="number" id="fbPrice"     value="4.00"  min="0" step="0.5">
    </div>

    <!-- COGS -->
    <div class="cfg-sub" style="color:var(--c-cog-h);">Wareneinsatz</div>
    <div class="col-hd col-hd--std">
      <span>Beschreibung</span><span>Art</span><span>Wert</span><span></span>
    </div>
    <div id="cogRows"></div>
    <button class="btn-add btn-add--cog" onclick="addCogRow()">+ Zeile</button>

    <!-- Wages -->
    <div class="cfg-sub" style="color:var(--c-opex-h);margin-top:10px;">Lohnkosten</div>
    <div class="col-hd col-hd--wage">
      <span>Beschreibung</span><span>Lohn €</span><span>SV %</span><span>Puffer %</span><span></span>
    </div>
    <div id="wageRows"></div>
    <button class="btn-add btn-add--opex" onclick="addWageRow()">+ Lohnzeile</button>

    <!-- OpEx -->
    <div class="cfg-sub" style="color:var(--c-opex-h);margin-top:10px;">Sonstige Kosten</div>
    <div class="col-hd col-hd--std">
      <span>Beschreibung</span><span>Art</span><span>Wert</span><span></span>
    </div>
    <div id="opexRows"></div>
    <button class="btn-add btn-add--opex" onclick="addOpexRow()">+ Zeile</button>

  </div>
</div>

<!-- ═══════════════════════ TABLE ═══════════════════════ -->
<div class="card card--table">
  <div class="card-header" style="cursor:default;">
    <span>Jahresübersicht – alle 12 Monate</span>
    <span style="font-size:10px;opacity:.6;">Gäste direkt in der Tabelle anpassen</span>
  </div>
  <div class="tbl-wrap">
    <table id="mainTable">
      <thead id="tblHead"></thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const TYPE_OPTS = `<option value="pct">% Umsatz</option><option value="perGuest">€/Gast</option><option value="fixed">€ fix</option>`;

// ── Formatters ─────────────────────────────────────────────────────────
const fmtE = v => v.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmtP = v => v.toFixed(1).replace('.', ',') + ' %';
const n    = id => parseFloat(document.getElementById(id)?.value) || 0;
const el   = id => document.getElementById(id);

// ── Guest values (persisted across table rebuilds) ─────────────────────
let guestValues = Array(12).fill(5000);

function saveGuests() {
  document.querySelectorAll('.g-inp').forEach((inp, i) => {
    guestValues[i] = parseFloat(inp.value) || 0;
  });
}

// ── Dynamic row helpers ────────────────────────────────────────────────
function calcDynAmt(type, val, rev, guests) {
  if (type === 'pct')      return (rev * val) / 100;
  if (type === 'perGuest') return val * guests;
  return val;
}

let cogId = 0;
function addCogRow(desc='', type='fixed', val=0) {
  const id = ++cogId;
  const d = document.createElement('div');
  d.className = 'drow drow--std'; d.dataset.id = id;
  d.innerHTML = `
    <input type="text" class="cd" placeholder="Beschreibung" value="${esc(desc)}">
    <select class="ct">${TYPE_OPTS}</select>
    <input type="number" class="cv" value="${val}" min="0" step="0.01">
    <button class="btn-del" onclick="this.closest('.drow').remove();recalc();">&#x2715;</button>`;
  d.querySelector('.ct').value = type;
  d.querySelectorAll('input,select').forEach(x => x.addEventListener('input', recalc));
  el('cogRows').appendChild(d);
  recalc();
}

let wageId = 0;
function addWageRow(desc='', wage=0, sv=20, puffer=5) {
  const id = ++wageId;
  const d = document.createElement('div');
  d.className = 'drow drow--wage'; d.dataset.id = id;
  d.innerHTML = `
    <input type="text" class="wd" placeholder="z.B. Vollzeit MA" value="${esc(desc)}">
    <input type="number" class="wb" value="${wage}" min="0" step="100">
    <input type="number" class="ws" value="${sv}"   min="0" step="0.5">
    <input type="number" class="wp" value="${puffer}" min="0" step="0.5">
    <button class="btn-del" onclick="this.closest('.drow').remove();recalc();">&#x2715;</button>`;
  d.querySelectorAll('input').forEach(x => x.addEventListener('input', recalc));
  el('wageRows').appendChild(d);
  recalc();
}

let opexId = 0;
function addOpexRow(desc='', type='fixed', val=0) {
  const id = ++opexId;
  const d = document.createElement('div');
  d.className = 'drow drow--std'; d.dataset.id = id;
  d.innerHTML = `
    <input type="text" class="od" placeholder="Beschreibung" value="${esc(desc)}">
    <select class="ot">${TYPE_OPTS}</select>
    <input type="number" class="ov" value="${val}" min="0" step="0.01">
    <button class="btn-del" onclick="this.closest('.drow').remove();recalc();">&#x2715;</button>`;
  d.querySelector('.ot').value = type;
  d.querySelectorAll('input,select').forEach(x => x.addEventListener('input', recalc));
  el('opexRows').appendChild(d);
  recalc();
}

function esc(s) { return String(s).replace(/['"<>&]/g, c => ({'\'':'&#39;','"':'&quot;','<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

// ── Config toggle ──────────────────────────────────────────────────────
function toggleCfg() {
  const b = el('cfgBody'), t = el('cfgToggle');
  const hidden = b.style.display === 'none';
  b.style.display = hidden ? '' : 'none';
  t.textContent = hidden ? '▲' : '▼';
}

// ── Build table header ─────────────────────────────────────────────────
function buildHead() {
  el('tblHead').innerHTML = `<tr>
    <th>Kennzahl</th>
    ${MONTHS.map(m => `<th>${m}</th>`).join('')}
    <th class="th-total">Jahr</th>
  </tr>`;
}

// ── Cell helpers ───────────────────────────────────────────────────────
function td(val, cls='', colored=false) {
  let color = '';
  if (colored) color = val < 0 ? ' neg' : ' pos';
  return `<td class="${cls}${color}">${fmtE(val)}</td>`;
}
function tdP(val, cls='') {
  return `<td class="${cls}" style="color:var(--muted);font-style:italic;">${fmtP(val)}</td>`;
}

// ── Main recalc & table render ─────────────────────────────────────────
function recalc() {
  saveGuests();

  const tp = n('ticketPrice'), rp = n('retailPrice'), gp = n('gamesPrice'), fb = n('fbPrice');

  // Gather COG rows config
  const cogCfg = [...document.querySelectorAll('#cogRows .drow')].map(r => ({
    label: r.querySelector('.cd').value || 'Wareneinsatz',
    type:  r.querySelector('.ct').value,
    val:   parseFloat(r.querySelector('.cv').value) || 0,
  }));

  // Gather wage rows config
  const wageCfg = [...document.querySelectorAll('#wageRows .drow')].map(r => ({
    label:  r.querySelector('.wd').value || 'Lohn',
    wage:   parseFloat(r.querySelector('.wb').value) || 0,
    sv:     parseFloat(r.querySelector('.ws').value) || 0,
    puffer: parseFloat(r.querySelector('.wp').value) || 0,
  }));

  // Gather opex rows config
  const opexCfg = [...document.querySelectorAll('#opexRows .drow')].map(r => ({
    label: r.querySelector('.od').value || 'Kosten',
    type:  r.querySelector('.ot').value,
    val:   parseFloat(r.querySelector('.ov').value) || 0,
  }));

  // Per-month calculations
  const months = guestValues.map(guests => {
    const ticketRev = tp * guests;
    const retailRev = rp * guests;
    const gamesRev  = gp * guests;
    const fbRev     = fb * guests;
    const totalRev  = ticketRev + retailRev + gamesRev + fbRev;

    const cogAmts = cogCfg.map(c => calcDynAmt(c.type, c.val, totalRev, guests));
    const totalCog = cogAmts.reduce((a, b) => a + b, 0);
    const grossProfit = totalRev - totalCog;

    const wageAmts = wageCfg.map(w => w.wage * (1 + (w.sv + w.puffer) / 100));
    const totalWage = wageAmts.reduce((a, b) => a + b, 0);

    const opexAmts = opexCfg.map(o => calcDynAmt(o.type, o.val, totalRev, guests));
    const totalOpex = totalWage + opexAmts.reduce((a, b) => a + b, 0);

    const ebitda = grossProfit - totalOpex;
    return { guests, ticketRev, retailRev, gamesRev, fbRev, totalRev,
             cogAmts, totalCog, grossProfit, wageAmts, opexAmts, totalWage, totalOpex, ebitda };
  });

  // Annual totals
  const sum = key => months.reduce((a, m) => a + m[key], 0);
  const sumArr = (key, i) => months.reduce((a, m) => a + m[key][i], 0);
  const annRev = sum('totalRev'), annGP = sum('grossProfit'), annEbitda = sum('ebitda');
  const annOpex = sum('totalOpex');

  // ── Build table body ──
  let rows = '';

  // Gäste row (with editable inputs)
  rows += `<tr class="tr-guests"><td>Gäste</td>`;
  months.forEach((m, i) => {
    rows += `<td class="td-guest"><input class="g-inp" type="number" value="${m.guests}" min="0" step="100" data-idx="${i}"></td>`;
  });
  rows += `<td class="td-total">${fmtE(guestValues.reduce((a,b)=>a+b,0))}</td></tr>`;

  // Revenue rows
  const revKeys = ['ticketRev','retailRev','gamesRev','fbRev'];
  const revLabels = ['Ticket-Umsatz','Retail-Umsatz','Games-Umsatz','F&B-Umsatz'];
  revKeys.forEach((k, li) => {
    rows += `<tr class="tr-rev"><td>${revLabels[li]}</td>`;
    months.forEach(m => rows += td(m[k]));
    rows += td(sum(k), 'td-total') + '</tr>';
  });

  // Revenue total
  rows += `<tr class="tr-rtot"><td>Gesamt-Umsatz</td>`;
  months.forEach(m => rows += td(m.totalRev));
  rows += td(annRev, 'td-total') + '</tr>';

  // COG rows
  cogCfg.forEach((c, ci) => {
    rows += `<tr class="tr-cog"><td>${esc(c.label)}</td>`;
    months.forEach(m => rows += td(m.cogAmts[ci]));
    rows += td(sumArr('cogAmts', ci), 'td-total') + '</tr>';
  });
  rows += `<tr class="tr-ctot"><td>Gesamt Wareneinsatz</td>`;
  months.forEach(m => rows += td(m.totalCog));
  rows += td(sum('totalCog'), 'td-total') + '</tr>';

  // Gross profit
  rows += `<tr class="tr-gp"><td>Rohertrag</td>`;
  months.forEach(m => rows += td(m.grossProfit, '', true));
  rows += td(annGP, 'td-total ' + (annGP < 0 ? 'neg' : 'pos')) + '</tr>';

  rows += `<tr class="tr-margin"><td>Rohertrag-Marge</td>`;
  months.forEach(m => rows += tdP(m.totalRev > 0 ? m.grossProfit / m.totalRev * 100 : 0));
  rows += tdP(annRev > 0 ? annGP / annRev * 100 : 0, 'td-total') + '</tr>';

  // Wage rows
  wageCfg.forEach((w, wi) => {
    const total = w.wage * (1 + (w.sv + w.puffer) / 100);
    rows += `<tr class="tr-wage"><td>${esc(w.label)}</td>`;
    months.forEach(() => rows += td(total));
    rows += td(total * 12, 'td-total') + '</tr>';
  });

  // OpEx rows
  opexCfg.forEach((o, oi) => {
    rows += `<tr class="tr-opex"><td>${esc(o.label)}</td>`;
    months.forEach(m => rows += td(m.opexAmts[oi]));
    rows += td(sumArr('opexAmts', oi), 'td-total') + '</tr>';
  });

  // OpEx total
  rows += `<tr class="tr-otot"><td>Betr. Aufwand gesamt</td>`;
  months.forEach(m => rows += td(m.totalOpex));
  rows += td(annOpex, 'td-total') + '</tr>';

  // EBITDA
  rows += `<tr class="tr-ebitda"><td>EBITDA</td>`;
  months.forEach(m => rows += td(m.ebitda, '', true));
  rows += td(annEbitda, 'td-total ' + (annEbitda < 0 ? 'neg' : 'pos')) + '</tr>';

  rows += `<tr class="tr-margin"><td>EBITDA-Marge</td>`;
  months.forEach(m => rows += tdP(m.totalRev > 0 ? m.ebitda / m.totalRev * 100 : 0));
  rows += tdP(annRev > 0 ? annEbitda / annRev * 100 : 0, 'td-total') + '</tr>';

  el('tblBody').innerHTML = rows;

  // Re-attach guest input listeners
  document.querySelectorAll('.g-inp').forEach(inp => {
    inp.addEventListener('input', () => {
      guestValues[+inp.dataset.idx] = parseFloat(inp.value) || 0;
      recalc();
    });
  });
}

// ── Static input listeners ─────────────────────────────────────────────
['ticketPrice','retailPrice','gamesPrice','fbPrice'].forEach(id => {
  el(id)?.addEventListener('input', recalc);
});

// ── Init ───────────────────────────────────────────────────────────────
