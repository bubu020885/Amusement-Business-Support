name: Deploy to KAS FTP

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy folder (index.html only)
        run: |
          mkdir -p deploy
          cp index.html deploy/

      - name: Deploy via FTP to leisureworkspace.com/business-planner/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: v032817.kasserver.com
          username: v032817
          password: ${{ secrets.KAS_FTP_PASSWORD }}
          port: 21
          security: loose
          server-dir: /leisureworkspace.com/business-planner/
          local-dir: ./deploy/
